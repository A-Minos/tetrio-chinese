on:
    push:
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: oven-sh/setup-bun@v2
            - run: bun install
            - run: bun run build
            - uses: JamesIves/github-pages-deploy-action@v4
              with:
                  branch: release/rolling
                  folder: dist
                  commit-message: ":bookmark: 滚动更新"
                  single-commit: true
                  force: true