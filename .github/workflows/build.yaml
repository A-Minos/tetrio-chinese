on:
    push:
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v6
            -   uses: oven-sh/setup-bun@v2
            -   run: bun install
            -   run: bun run build
            -   run: |
                    git checkout -B release/rolling
                    git add -A
                    git commit -m ":bookmark: 滚动更新" --allow-empty
                    git push origin release/rolling --force